  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    :root{--bg:#0d0f12;--surface:#14171d;--card:#1c2029;--border:#2a303c;--hover:#252b37;--green:#10b981;--cyan:#06b6d4;--muted:#8993a5}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#e2e8f0;font-family:"Plus Jakarta Sans",sans-serif;min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{width:340px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
    .brand-row{padding:22px 22px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a303c99}
    .brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-.7px}
    .brand-icon{height:40px;width:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--cyan));color:#07130f;font-size:22px;box-shadow:0 8px 24px #10b98130}
    .pro{font-size:10px;font-weight:800;letter-spacing:1px;color:#34d399;border:1px solid #10b98145;background:#10b98114;padding:6px 9px;border-radius:999px}
    .search-wrap{padding:18px 18px 12px;position:relative}
    .search-wrap span{position:absolute;left:32px;top:29px;color:#8b95a7;font-size:18px}
    #searchInput{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--card);color:#f8fafc;padding:13px 14px 13px 42px;outline:none;font-size:13px;transition:.2s}
    #searchInput:focus{border-color:#10b98199;box-shadow:0 0 0 3px #10b98114}
    .list-heading{padding:8px 22px 12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#9aa4b5;font-weight:700}
    #songCount{color:#697386;letter-spacing:0;text-transform:none}
    #playlistContainer{overflow:auto;padding:0 10px 16px;flex:1}
    .song-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid transparent;border-radius:12px;cursor:pointer;transition:background .18s,border .18s;margin-bottom:3px}
    .song-item:hover{background:var(--card)}
    .song-item.active{background:#10b98117;border-color:#10b98145}
    .thumb{width:44px;height:44px;flex-shrink:0;border-radius:9px;object-fit:cover;background:#242a34}
    .song-meta{min-width:0;flex:1}
    .song-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dbe2ec}
    .song-artist{font-size:11px;color:#8791a2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .song-item.active .song-name{color:#34d399}
    .playing-bars{color:#34d399;font-size:14px;flex-shrink:0}
    .main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
    .ambient{position:absolute;inset:0 0 auto;height:52%;background:radial-gradient(ellipse at 50% 0%,#10b98118,transparent 68%);pointer-events:none}
    .topbar{position:relative;z-index:1;padding:22px 34px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a303c80;background:#0d0f1270}
    .status{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9aa4b5}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #10b981}
    .top-note{font-size:12px;color:#737e90}
    .workspace{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:38px 24px 28px}
    .player{width:min(100%,540px);display:flex;flex-direction:column;align-items:center}
    .cover-wrap{width:min(310px,68vw);aspect-ratio:1;position:relative;margin-bottom:30px}
    .cover-glow{position:absolute;inset:-13px;border-radius:30px;background:linear-gradient(135deg,var(--green),var(--cyan));filter:blur(32px);opacity:.22;transition:opacity .4s}
    .cover-wrap:hover .cover-glow{opacity:.4}
    #playerCover{position:relative;width:100%;height:100%;object-fit:cover;border-radius:23px;border:1px solid #ffffff20;box-shadow:0 25px 70px #0008;background:var(--card)}
    .eyebrow{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;font-weight:800;color:#34d399;margin-bottom:10px}
    #playerTitle{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-1px;color:white;text-align:center;margin:0 0 8px;max-width:100%;overflow-wrap:anywhere}
    #playerArtist{font-size:14px;color:#9aa4b5;text-align:center;margin:0 0 28px}
    .timeline{width:100%;max-width:470px}
    input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
    input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:99px}
    input[type=range]::-moz-range-track{height:4px;background:var(--border);border-radius:99px}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--green);margin-top:-4.5px;box-shadow:0 0 10px #10b98155}
    input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--green)}
    #progressBar{width:100%;display:block}
    .times{display:flex;justify-content:space-between;margin-top:10px;color:#7d8798;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
    .controls{display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,30px);margin-top:28px}
    .control{border:0;background:transparent;color:#8b95a7;padding:9px;font-size:22px;line-height:1;transition:.2s}
    .control:hover,.control.active{color:#34d399}
    .skip{font-size:27px;color:#d4dbe6}
    .play-button{height:64px;width:64px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--cyan));color:#06140f;font-size:25px;display:grid;place-items:center;padding-left:4px;box-shadow:0 8px 28px #10b98135;transition:transform .2s}
    .play-button:hover{transform:scale(1.06)}
    .bottom{position:relative;z-index:1;border-top:1px solid #2a303c80;display:flex;justify-content:space-between;align-items:center;padding:16px 30px;color:#8b95a7;font-size:11px}
    .audio-label{display:flex;align-items:center;gap:9px}
    .audio-icon{color:#34d399;font-size:18px}
    .volume{display:flex;align-items:center;gap:12px;width:180px}
    #volumeBar{width:100%}
    .empty{padding:28px 12px;text-align:center;color:#778195;font-size:13px}
    .mobile-heading{display:none}
    @media(max-width:800px){
      .app{flex-direction:column}
      .sidebar{width:100%;height:42vh;min-height:260px;position:relative;border-right:0;border-bottom:1px solid var(--border)}
      .brand-row{padding:14px 18px}
      .brand{font-size:19px}.brand-icon{width:35px;height:35px}
      .search-wrap{padding:12px 16px 8px}.search-wrap span{top:23px;left:29px}
      .list-heading{padding:7px 19px 9px}
      #playlistContainer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:2px;padding:0 10px 12px}
      .song-item{padding:7px;gap:8px}
      .thumb{width:38px;height:38px}
      .song-name{font-size:11px}.song-artist{font-size:10px}
      .main{min-height:58vh}
      .topbar{padding:15px 18px}
      .workspace{padding:28px 20px}
      .cover-wrap{width:min(230px,54vw);margin-bottom:22px}
      #playerArtist{margin-bottom:23px}
      .bottom{padding:13px 18px}
      .volume{width:125px}
    }
    @media(max-width:420px){
      #playlistContainer{grid-template-columns:1fr}
      .sidebar{height:40vh}
      .top-note{display:none}
      .cover-wrap{width:min(190px,52vw)}
      .controls{gap:13px;margin-top:23px}
      .play-button{width:57px;height:57px}
      .control{font-size:19px}.skip{font-size:24px}
      .bottom{gap:12px}.audio-label span:last-child{max-width:130px}
    }
  </style>
</head>

    <aside class="sidebar">

        <div class="brand"><div class="brand-icon">♫</div><span>Sepitify</span></div>
        <span class="pro">WEB PLAYER</span>
      </div>
      <div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="Cari lagu atau artis..." autocomplete="off"></div>
      <div class="list-heading"><span>Daftar Lagu</span><span id="songCount">59 lagu</span></div>
      <div id="playlistContainer"></div>
    </aside>
    <main class="main">
      <div class="ambient"></div>
      <header class="topbar">

        <div class="top-note">Koleksi musik kamu, dalam satu tempat</div>
      </header>
      <section class="workspace">
        <div class="player">
          <div class="cover-wrap"><div class="cover-glow"></div><img id="playerCover" src="hindia.jpg" alt="Sampul album"></div>
          <div class="eyebrow">NOW PLAYING</div>
          <h1 id="playerTitle">Hindia - Secukupnya</h1>
          <p id="playerArtist">Hindia</p>
          <div class="timeline">
            <input type="range" id="progressBar" min="0" max="100" value="0" aria-label="Posisi lagu">
            <div class="times"><span id="currentTime">0:00</span><span id="totalDuration">0:00</span></div>
          </div>
          <div class="controls">
            <button class="control" id="shuffleBtn" title="Acak" aria-label="Acak">⤨</button>
            <button class="control skip" id="prevBtn" title="Lagu sebelumnya" aria-label="Lagu sebelumnya">|◀</button>
            <button class="play-button" id="playBtn" title="Putar" aria-label="Putar atau jeda">▶</button>
            <button class="control skip" id="nextBtn" title="Lagu berikutnya" aria-label="Lagu berikutnya">▶|</button>
            <button class="control" id="repeatBtn" title="Ulangi" aria-label="Ulangi">⟳</button>
          </div>
        </div>
      </section>
      <footer class="bottom">
        <div class="audio-label"><span class="audio-icon">♫</span><span>Audio lokal · Sepitify</span></div>
        <div class="volume"><span id="volumeIcon">🔊</span><input type="range" id="volumeBar" min="0" max="100" value="80" aria-label="Volume"></div>
      </footer>
    </main>
  </div>

    "title": "Ruth B. - Dandelions",
    "file": "Ruth B. - Dandelions (Lyrics).mp3",
    "artist": "Ruth B.",
    "cover": "ruth b..jpg"
  },
  {
    "title": "Mood",
    "file": "Iframe 24kGoldn - Mood Remix (Lyrics) ft. Justin Bieber, J Balvin, Iann Dior [f1J4dRTMy9A].mp3",
    "artist": "24kGoldn",
    "cover": "24kgoldn.jpg"
  },
  {
    "title": "Replay",
    "file": "Iframe Iyaz - Replay \\_ Lyrics [GqYj_f9gVqM].mp3",
    "artist": "Iyaz",
    "cover": "iyaz.jpg"
  },
  {
    "title": "Beauty And A Beat",
    "file": "Iframe Justin Bieber, Nicki Minaj – Beauty And A Beat (Lyrics) [J9abt3xpdDU].mp3",
    "artist": "Justin Bieber ft Nicki Minaj",
    "cover": "justin bieber.jpg"

  {

    "file": "Tie me down.mp3",
    "artist": "Gryffin, Elley Duhé",
    "cover": "te me down.jpg"

];

    let currentSongIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 0; // 0 = mati, 1 = ulangi semua, 2 = ulangi satu
    const audio = document.getElementById('audio');
    const playlistContainer = document.getElementById('playlistContainer');
    const searchInput = document.getElementById('searchInput');
    const playerCover = document.getElementById('playerCover');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const songCountEl = document.getElementById('songCount');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');

    function secondsToTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function renderPlaylist(list) {
      playlistContainer.innerHTML = '';
      songCountEl.textContent = `${list.length} dari ${songs.length} lagu`;
      if (!list.length) {
        playlistContainer.innerHTML = '<div class="empty">Lagu tidak ditemukan.</div>';
        return;
      }
      list.forEach(song => {
        const index = songs.indexOf(song);
        const item = document.createElement('div');
        item.className = `song-item${index === currentSongIndex ? ' active' : ''}`;
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');
        item.innerHTML = `
          <img class="thumb" src="${escapeAttribute(song.cover)}" alt="" onerror="this.style.opacity='.35'">
          <div class="song-meta">
            <div class="song-name" title="${escapeAttribute(song.title)}">${escapeHTML(song.title)}</div>
            <div class="song-artist">${escapeHTML(song.artist)}</div>
          </div>
          <span class="playing-bars">${index === currentSongIndex && isPlaying ? '♫' : ''}</span>`;
        item.addEventListener('click', () => selectSong(index, true));
        item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSong(index, true); }});
        playlistContainer.appendChild(item);
      });
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttribute(value) { return escapeHTML(value); }
    function filteredSongs() {
      const query = searchInput.value.trim().toLowerCase();
      return songs.filter(song => song.title.toLowerCase().includes(query) || song.artist.toLowerCase().includes(query));
    }

    function selectSong(index, autoplay = false) {
      currentSongIndex = (index + songs.length) % songs.length;
      const song = songs[currentSongIndex];
      audio.src = song.file;
      playerCover.src = song.cover;
      playerCover.alt = `Sampul ${song.title}`;
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      currentTimeEl.textContent = '0:00';
      totalDurationEl.textContent = '0:00';
      progressBar.value = 0;
      renderPlaylist(filteredSongs());
      if ('mediaSession' in navigator && 'MediaMetadata' in window) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title, artist: song.artist, album: 'Sepitify',
          artwork: [{src: song.cover, sizes: '512x512', type: 'image/jpeg'}]
        });
      }
      if (autoplay) playAudio();
    }

    async function playAudio() {
      try {
        await audio.play();
        isPlaying = true;
        playBtn.textContent = 'Ⅱ';
        playBtn.title = 'Jeda';
      } catch (error) {
        isPlaying = false;
        playBtn.textContent = '▶';
        console.warn('Lagu tidak dapat diputar. Periksa nama dan lokasi file audio:', error);
      }
      renderPlaylist(filteredSongs());
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      playBtn.title = 'Putar';
      renderPlaylist(filteredSongs());
    }

    function togglePlay() {
      if (isPlaying) pauseAudio();
      else playAudio();
    }

    function nextTrack() {
      if (isShuffle && songs.length > 1) {
        let nextIndex;
        do { nextIndex = Math.floor(Math.random() * songs.length); } while (nextIndex === currentSongIndex);
        selectSong(nextIndex, true);
      } else if (repeatMode === 2) {
        audio.currentTime = 0;
        playAudio();
      } else {
        const atEnd = currentSongIndex === songs.length - 1;
        if (atEnd && repeatMode === 0) {
          pauseAudio();
          audio.currentTime = 0;
          progressBar.value = 0;
          currentTimeEl.textContent = '0:00';
          return;
        }
        selectSong((currentSongIndex + 1) % songs.length, true);
      }
    }

    function prevTrack() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      selectSong((currentSongIndex - 1 + songs.length) % songs.length, true);
    }

    playBtn.addEventListener('click', togglePlay);
    document.getElementById('nextBtn').addEventListener('click', nextTrack);
    document.getElementById('prevBtn').addEventListener('click', prevTrack);
    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
      shuffleBtn.title = isShuffle ? 'Acak aktif' : 'Acak';
    });
    repeatBtn.addEventListener('click', () => {
      repeatMode = (repeatMode + 1) % 3;
      repeatBtn.classList.toggle('active', repeatMode !== 0);
      repeatBtn.textContent = repeatMode === 2 ? '⟳¹' : '⟳';
      repeatBtn.title = ['Ulangi mati', 'Ulangi semua', 'Ulangi satu'][repeatMode];
    });
    searchInput.addEventListener('input', () => renderPlaylist(filteredSongs()));
    progressBar.addEventListener('input', () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = (Number(progressBar.value) / 100) * audio.duration;
      }
    });
    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = secondsToTime(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = secondsToTime(audio.currentTime);
        totalDurationEl.textContent = secondsToTime(audio.duration);
      }
    });
    audio.addEventListener('play', () => {
      isPlaying = true; playBtn.textContent = 'Ⅱ'; renderPlaylist(filteredSongs());
      if ('mediaSession' in navigator) {
        try { navigator.mediaSession.setActionHandler('play', playAudio); navigator.mediaSession.setActionHandler('pause', pauseAudio); navigator.mediaSession.setActionHandler('previoustrack', prevTrack); navigator.mediaSession.setActionHandler('nexttrack', nextTrack); } catch (_) {}
      }
    });
    audio.addEventListener('pause', () => {
      isPlaying = false; playBtn.textContent = '▶'; renderPlaylist(filteredSongs());
    });
    audio.addEventListener('ended', () => {
      if (repeatMode === 2) { audio.currentTime = 0; playAudio(); }
      else if (currentSongIndex < songs.length - 1 || repeatMode === 1 || isShuffle) nextTrack();
      else { progressBar.value = 0; currentTimeEl.textContent = '0:00'; }
    });
    audio.addEventListener('error', () => {
      console.warn(`File audio tidak ditemukan atau tidak dapat dibaca: ${songs[currentSongIndex].file}`);
    });
    const volumeBar = document.getElementById('volumeBar');
    const volumeIcon = document.getElementById('volumeIcon');
    audio.volume = Number(volumeBar.value) / 100;
    volumeBar.addEventListener('input', () => {
      audio.volume = Number(volumeBar.value) / 100;
      volumeIcon.textContent = audio.volume === 0 ? '🔇' : audio.volume < 0.5 ? '🔉' : '🔊';
    });
    volumeIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.dataset.previousVolume = audio.volume;
        audio.volume = 0; volumeBar.value = 0; volumeIcon.textContent = '🔇';
      } else {
        audio.volume = Number(audio.dataset.previousVolume || 0.8);
        volumeBar.value = audio.volume * 100; volumeIcon.textContent = '🔊';
      }
    });

    renderPlaylist(songs);
    selectSong(0);
  </script>
</body>
</html>
